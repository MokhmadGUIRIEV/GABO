<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GABO — Lobby</title>
  <link rel="stylesheet" href="/static/css/style.css?v=2" />
</head>
<body>
  <div class="wrap">
    <div class="top-nav">
      <h1 class="brand" style="margin:0;">GABO</h1>
      <div class="row">
        <span class="hint" id="welcome"></span>
        <button class="secondary" id="logout-btn">Déconnexion</button>
      </div>
    </div>

    <div class="panel">
      <h2>Nouvelle partie (jeu local, un seul appareil)</h2>
      <p class="hint">
        Entrez les noms des joueurs (2 à 6) qui vont se partager cet appareil à tour de rôle.
        Chacun regardera ses propres cartes en tenant l'écran caché aux autres au bon moment.
      </p>
      <div id="player-inputs"></div>
      <div class="row">
        <button class="secondary" id="add-player-btn">+ Ajouter un joueur</button>
        <button class="secondary" id="remove-player-btn">- Retirer</button>
      </div>
      <div class="row" style="margin-top:16px;">
        <button id="create-room-btn">Créer la partie</button>
      </div>
      <div class="error-msg" id="create-error"></div>
    </div>

    <div class="panel">
      <h2>Historique de mes parties</h2>
      <div id="history-container" class="hint">Chargement...</div>
    </div>
  </div>

  <script src="/static/js/api.js?v=2"></script>
  <script>
    let user = null;

    function renderPlayerInputs(names) {
      const container = document.getElementById("player-inputs");
      container.innerHTML = "";
      names.forEach((name, i) => {
        const div = document.createElement("div");
        div.className = "player-name-input";
        div.innerHTML = `<span>${i + 1}.</span> <input type="text" data-idx="${i}" value="${name}" placeholder="Nom du joueur ${i + 1}" />`;
        container.appendChild(div);
      });
    }

    let playerNames = ["", ""];

    function syncPlayerNames() {
      document.querySelectorAll("#player-inputs input").forEach((input) => {
        playerNames[Number(input.dataset.idx)] = input.value;
      });
    }

    renderPlayerInputs(playerNames);

    document.getElementById("add-player-btn").addEventListener("click", () => {
      syncPlayerNames();
      if (playerNames.length >= 6) return;
      playerNames.push("");
      renderPlayerInputs(playerNames);
    });

    document.getElementById("remove-player-btn").addEventListener("click", () => {
      syncPlayerNames();
      if (playerNames.length <= 2) return;
      playerNames.pop();
      renderPlayerInputs(playerNames);
    });

    document.getElementById("create-room-btn").addEventListener("click", async () => {
      syncPlayerNames();
      const errorEl = document.getElementById("create-error");
      errorEl.textContent = "";
      const names = playerNames.map((n) => n.trim()).filter(Boolean);
      if (names.length < 2) {
        errorEl.textContent = "Il faut au moins 2 joueurs.";
        return;
      }
      try {
        const room = await Api.createRoom(names);
        window.location.href = `/game.html?code=${room.code}`;
      } catch (e) {
        errorEl.textContent = e.message;
      }
    });

    document.getElementById("logout-btn").addEventListener("click", async () => {
      await Api.logout();
      window.location.href = "/index.html";
    });

    function formatDate(iso) {
      if (!iso) return "-";
      const d = new Date(iso);
      return d.toLocaleString("fr-FR");
    }

    async function loadHistory() {
      const container = document.getElementById("history-container");
      try {
        const games = await Api.history();
        if (games.length === 0) {
          container.textContent = "Aucune partie jouée pour l'instant.";
          return;
        }
        const table = document.createElement("table");
        table.className = "history-table";
        table.innerHTML = `
          <thead>
            <tr><th>Date</th><th>Salle</th><th>Manches</th><th>Statut</th><th>Résultats</th></tr>
          </thead>
          <tbody></tbody>
        `;
        const tbody = table.querySelector("tbody");
        games.forEach((g) => {
          const tr = document.createElement("tr");
          const results = g.results
            .slice()
            .sort((a, b) => a.final_score - b.final_score)
            .map((r) => `${r.player_name}: ${r.final_score}${r.is_winner ? " 🏆" : ""}${r.eliminated ? " (éliminé)" : ""}`)
            .join(" · ");
          tr.innerHTML = `
            <td>${formatDate(g.started_at)}</td>
            <td>${g.room_code}</td>
            <td>${g.rounds_played}</td>
            <td>${g.finished ? "Terminée" : "En cours"}</td>
            <td>${results || "-"}</td>
          `;
          tbody.appendChild(tr);
        });
        container.innerHTML = "";
        container.appendChild(table);
      } catch (e) {
        container.textContent = "Impossible de charger l'historique.";
      }
    }

    (async () => {
      try {
        user = await Api.me();
        document.getElementById("welcome").textContent = `Connecté en tant que ${user.display_name}`;
        loadHistory();
      } catch (e) {
        window.location.href = "/index.html";
      }
    })();
  </script>
</body>
</html>
