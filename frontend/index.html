<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GABO</title>
  <link rel="stylesheet" href="/static/css/style.css?v=7" />
</head>
<body>
  <div class="wrap">
    <h1 class="brand">GABO</h1>
    <p class="subtitle">Le jeu de cartes où mémoire et bluff font la différence.</p>

    <div class="panel" id="login-panel">
      <h2>Connexion</h2>
      <label for="login-email">Email</label>
      <input type="email" id="login-email" autocomplete="email" />
      <label for="login-password">Mot de passe</label>
      <input type="password" id="login-password" autocomplete="current-password" />
      <div class="row" style="margin-top:14px;">
        <button id="login-btn">Se connecter</button>
      </div>
      <div class="error-msg" id="login-error"></div>
    </div>

    <div class="panel" id="register-panel">
      <h2>Créer un compte</h2>
      <label for="reg-name">Pseudo</label>
      <input type="text" id="reg-name" autocomplete="nickname" />
      <label for="reg-email">Email</label>
      <input type="email" id="reg-email" autocomplete="email" />
      <label for="reg-password">Mot de passe (6 caractères min.)</label>
      <input type="password" id="reg-password" autocomplete="new-password" />
      <div class="row" style="margin-top:14px;">
        <button id="register-btn">Créer mon compte</button>
      </div>
      <div class="error-msg" id="register-error"></div>
    </div>
  </div>

  <script src="/static/js/api.js?v=7"></script>
  <script>
    const NEXT = safeNextPath(new URLSearchParams(window.location.search).get("next")) || "/lobby.html";

    (async () => {
      try {
        await Api.me();
        window.location.href = NEXT;
      } catch (e) {
        // Not logged in, stay on this page.
      }
    })();

    document.getElementById("login-btn").addEventListener("click", async () => {
      const errorEl = document.getElementById("login-error");
      errorEl.textContent = "";
      try {
        await Api.login(
          document.getElementById("login-email").value.trim(),
          document.getElementById("login-password").value
        );
        window.location.href = NEXT;
      } catch (e) {
        errorEl.textContent = e.message;
      }
    });

    document.getElementById("register-btn").addEventListener("click", async () => {
      const errorEl = document.getElementById("register-error");
      errorEl.textContent = "";
      try {
        await Api.register(
          document.getElementById("reg-email").value.trim(),
          document.getElementById("reg-name").value.trim(),
          document.getElementById("reg-password").value
        );
        window.location.href = NEXT;
      } catch (e) {
        errorEl.textContent = e.message;
      }
    });
  </script>
</body>
</html>
